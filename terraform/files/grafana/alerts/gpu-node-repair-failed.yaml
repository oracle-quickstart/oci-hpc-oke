apiVersion: 1
groups:
    - orgId: 1
      name: GPU Health Monitoring
      folder: Alerts
      interval: 1m
      rules:
        - uid: oke_gpu_node_repair_failed
          title: GPU Node Repair Failed
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 300
                to: 0
              datasourceUid: prometheus
              model:
                editorMode: code
                expr: label_replace(max by(node, action) (oke_node_health_report_last_repair_info{dry_run="false",result="Failed"}) and on(node) (time() - oke_node_health_report_last_repair_completed_timestamp_seconds < 3600), "hostname", "$1", "node", "(.*)")
                instant: true
                intervalMs: 300000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 0s
          keep_firing_for: 30m
          annotations:
            description: A GPU node repair failed in the last hour. See the GPU Node Repairs dashboard.
          labels: {}
          isPaused: false
          notification_settings:
            receiver: ons-webhook
            repeat_interval: 24h
