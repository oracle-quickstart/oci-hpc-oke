labeler:
  enabled: true
  image:
    repository: ghcr.io/astral-sh/uv
    # Pinned by digest so a retagged image cannot reach a privileged,
    # host-namespace pod. The tag is kept for readability only.
    tag: "0.7.12-python3.12-bookworm-slim@sha256:a071e4d58c7697cda6f8a8c3e64c2ffdf2b9246c6991dbd92d3c3b5ae61b5d9a"
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  tolerations:
    - operator: Exists
  nodeSelector: {}
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: nvidia.com/gpu
                operator: Exists
          - matchExpressions:
              - key: amd.com/gpu
                operator: Exists
  podAnnotations: {}
  podLabels: {}
  interval: 300
  labelMappings: {}
  # Example:
  # labelMappings:
  #   gpu-fabric-racks.csv: |
  #     oci.oraclecloud.com/host.gpu_memory_fabric_id,oci.oraclecloud.com/host.internal_rack_id
  #     ocid1.computegpumemoryfabric...bq,sk-e6df6e21-5b1d-492e-a5b1-145abbbdaa1b
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 100m
      # The first run OOMs below 256Mi while uv fetches the kubernetes client;
      # later runs reuse the uv cache and stay small.
      memory: 256Mi
  controller:
    interval: 900
    nodeSelectorLabel: ""
    nodeSelector: {}
    tolerations:
      - operator: Exists
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

# Annotates Slurm worker nodes with the slurm-operator (chart 1.2+)
# nodeset.slinky.slurm.net/hostname-override annotation so Slurm node names
# stay clean hostnames when the Kubernetes node names are private IPs
# (stacks deployed with hostname_override=false).
annotator:
  enabled: false
  image:
    repository: ghcr.io/astral-sh/uv
    # Pinned by digest so a retagged image cannot reach a privileged,
    # host-namespace pod. The tag is kept for readability only.
    tag: "0.7.12-python3.12-bookworm-slim@sha256:a071e4d58c7697cda6f8a8c3e64c2ffdf2b9246c6991dbd92d3c3b5ae61b5d9a"
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  tolerations:
    - operator: Exists
  nodeSelector: {}
  # Target only the Slurm worker pools; the ops pool must not be annotated.
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: oke.oraclecloud.com/pool.name
                operator: In
                values:
                  - oke-gpu
                  - oke-rdma
                  - oke-gmc
                  - oke-cpu
  podAnnotations: {}
  podLabels: {}
  interval: 300
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 100m
      # The first run OOMs below 256Mi while uv fetches the kubernetes client;
      # later runs reuse the uv cache and stay small.
      memory: 256Mi

# Slurm topology management. The annotator DaemonSet writes the
# topology.slinky.slurm.net/spec node annotation from IMDS rdmaTopologyData,
# and the controller Deployment regenerates topology.yaml in the slurm
# chart's extra-config ConfigMap from the rdma.* node labels.
topology:
  enabled: false
  # Namespace and name of the ConfigMap the slurm chart renders from its
  # configFiles value (helm release fullname + "-config-extra").
  slurmNamespace: slurm
  configMapName: slurm-config-extra
  # Topology marked cluster_default in topology.yaml: tree or block.
  defaultTopology: tree
  # auto derives block_sizes from live local block populations, or a
  # comma-separated list of integers.
  blockSizes: auto
  # Topology sync cadence in seconds. Short on purpose: fresh installs hit a
  # 404 before the Slurm chart exists, and helm upgrades briefly revert the
  # generated file to the bootstrap skeleton.
  syncInterval: 120
  # Node pools included in the generated topology.
  workerPools:
    - oke-gpu
    - oke-rdma
    - oke-gmc
    - oke-cpu

prepuller:
  enabled: false
  image:
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  tolerations:
    - operator: Exists
  nodeSelector: {}
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: nvidia.com/gpu
                operator: Exists
          - matchExpressions:
              - key: amd.com/gpu
                operator: Exists
  podAnnotations: {}
  podLabels: {}
  pauseImage: registry.k8s.io/pause:3.10
  initResources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
  pauseResources:
    requests:
      cpu: 1m
      memory: 16Mi
    limits:
      cpu: 10m
      memory: 16Mi
  groups:
    nvidia:
      nodeSelector:
        nvidia.com/gpu: "true"
      images:
        - iad.ocir.io/idxzjcdglx2s/nccl-tests:cuda-13.1.1-ubuntu-24.04-nccl-2.29.3-020926.1
    amd:
      nodeSelector:
        amd.com/gpu: "true"
      images:
        - iad.ocir.io/idxzjcdglx2s/rccl-tests:rocm-7.1.1-ubuntu22.04-rccl-2.27.7-012126.1

hostexec:
  enabled: true
  imagePullSecrets: []
  hostRootPath: /
  interval: 30
  priorityClassName: system-node-critical
  tolerations:
    - operator: Exists
  nodeSelector: {}
  affinity: {}
  podAnnotations: {}
  podLabels: {}
  image:
    repository: ghcr.io/astral-sh/uv
    # Pinned by digest so a retagged image cannot reach a privileged,
    # host-namespace pod. The tag is kept for readability only.
    tag: "0.7.12-python3.12-bookworm-slim@sha256:a071e4d58c7697cda6f8a8c3e64c2ffdf2b9246c6991dbd92d3c3b5ae61b5d9a"
    pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
  script: |
    #!/usr/bin/env bash
    set -euo pipefail

    if ! modinfo lnet >/dev/null 2>&1; then
      echo "lnet kernel module is not available on this node; skipping"
      exit 0
    fi

    if ! grep -q '^lnet ' /proc/modules 2>/dev/null; then
      echo "LNet not loaded, loading..."
      modprobe lnet
    fi

    lnet_output="$(lnetctl net show 2>&1 || true)"

    if printf '%s\n' "$lnet_output" | grep -q "LNet stack down"; then
      lnetctl lnet configure
      DEFAULT_IFACE=$(ip route show default | awk '/default/ {print $5}')
      lnetctl net add --net tcp --if "$DEFAULT_IFACE" --peer-timeout 180 --peer-credits 120 --credits 1024
      echo "LNet configured successfully"
    fi

# Keeps 802.1X alive for claimed RDMA PFs and restores OCA policy routes
# after the PFs return to the host.
# Only needed on clusters using Dranet PF passthrough.
rdmaPfReconciler:
  enabled: false
  # Upper bound in seconds between reconciliation passes. Must be a positive
  # integer. A host link event reconciles sooner.
  interval: 10
  # Milliseconds of quiet to wait after host link events before reconciling, so
  # a pass does not run while Dranet is still configuring a PF.
  settleMs: 500
  priorityClassName: system-node-critical
  terminationGracePeriodSeconds: 30
  imagePullSecrets: []
  tolerations:
    - operator: Exists
  nodeSelector: {}
  # RDMA-capable shapes. Matched on node.kubernetes.io/instance-type, which the
  # cloud provider sets at node registration, unlike GPU labels which appear
  # only after the device plugin starts. The reconciler also self-selects at
  # runtime, exiting immediately on a node with no RDMA interfaces, so this is
  # belt and braces. Set to [] to schedule everywhere.
  shapes:
    - "BM.HPC2.36"
    - "BM.GPU4.8"
    - "BM.GPU.B4.8"
    - "BM.GPU.A100-v2.8"
    - "BM.GPU.H100.8"
    - "BM.GPU.H200.8"
    - "BM.GPU.B200.8"
    - "BM.GPU.B300.8"
    - "BM.GPU.B300.HS.8"
    - "BM.GPU.GB200.4"
    - "BM.GPU.GB200-v2.4"
    - "BM.GPU.GB200-v3.4"
    - "BM.GPU.GB300.4"
    - "BM.GPU.MI300X.8"
    - "BM.GPU.MI355X-v0.8"
    - "BM.GPU.MI355X.8"
    - "BM.GPU.MI355X-v1.8"
    - "BM.GPU.L40S.4"
    - "BM.Optimized3.36"
    - "BM.HPC.E5.144"
  # Replaces the generated shape affinity entirely when set.
  affinity: {}
  podAnnotations: {}
  podLabels: {}
  image:
    repository: ghcr.io/astral-sh/uv
    # Pinned by digest so a retagged image cannot reach a privileged,
    # host-namespace pod. The tag is kept for readability only.
    tag: "0.7.12-python3.12-bookworm-slim@sha256:a071e4d58c7697cda6f8a8c3e64c2ffdf2b9246c6991dbd92d3c3b5ae61b5d9a"
    pullPolicy: IfNotPresent
    resources:
      requests:
        # Held well above the idle average so CPU weight is high enough that a
        # busy GPU node cannot starve the reconciler of the core the limit allows.
        cpu: 100m
        memory: 64Mi
      limits:
        # A pass is a few hundred sequential forks, so it cannot use more than
        # one core but it does want a whole one briefly. A tighter limit does
        # not reduce its CPU cost, it only stretches each pass over more
        # scheduling periods.
        cpu: "1"
        memory: 128Mi
