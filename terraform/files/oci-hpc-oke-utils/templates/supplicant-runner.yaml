{{- if .Values.supplicantRunner.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "oci-hpc-oke-utils.fullname" . }}-supplicant-runner
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "oci-hpc-oke-utils.labels" . | nindent 4 }}
    app.kubernetes.io/component: supplicant-runner
spec:
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      # A restart briefly stops this pod's supplicants, so roll slowly.
      maxUnavailable: "10%"
  selector:
    matchLabels:
      {{- include "oci-hpc-oke-utils.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: supplicant-runner
  template:
    metadata:
      labels:
        {{- include "oci-hpc-oke-utils.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: supplicant-runner
        {{- with .Values.supplicantRunner.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.supplicantRunner.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      hostPID: true
      priorityClassName: {{ .Values.supplicantRunner.priorityClassName }}
      terminationGracePeriodSeconds: {{ .Values.supplicantRunner.terminationGracePeriodSeconds }}
      {{- with .Values.supplicantRunner.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.supplicantRunner.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.supplicantRunner.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.supplicantRunner.affinity }}
      affinity:
        {{- toYaml .Values.supplicantRunner.affinity | nindent 8 }}
      {{- else if .Values.supplicantRunner.shapes }}
      # instance-type is set at node registration, unlike GPU labels.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node.kubernetes.io/instance-type
                    operator: In
                    values:
                      {{- toYaml .Values.supplicantRunner.shapes | nindent 22 }}
      {{- end }}
      volumes:
        - name: script
          configMap:
            name: {{ include "oci-hpc-oke-utils.supplicantRunnerScriptName" . }}
            defaultMode: 0755
        # Health markers live here, off the container writable layer.
        - name: run
          emptyDir: {}
      containers:
        - name: supplicant-runner
          image: "{{ .Values.supplicantRunner.image.repository }}:{{ .Values.supplicantRunner.image.tag }}"
          imagePullPolicy: {{ .Values.supplicantRunner.image.pullPolicy }}
          command: ["/bin/bash", "/scripts/runner.sh"]
          env:
            - name: SUPPLICANT_RUNNER_INTERVAL
              value: {{ .Values.supplicantRunner.interval | quote }}
            - name: SUPPLICANT_RUNNER_SETTLE_MS
              value: {{ .Values.supplicantRunner.settleMs | quote }}
          securityContext:
            privileged: true
          # Covers the periodic wait, bounded event settle, and a slow pass.
          # The floor stops a lower interval from tightening the window.
          {{- $settleWindow := div (add (.Values.supplicantRunner.settleMs | int) 1249) 1000 | int }}
          {{- $stale := max (add (mul (.Values.supplicantRunner.interval | int) 6) $settleWindow 60) 180 | int }}
          # Gates liveness until the first pass completes.
          # A slow first pass is not a wedged loop.
          startupProbe:
            exec:
              command: ["/bin/bash", "-c", "test -s /run/health/alive"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - test "$(( $(date +%s) - $(cat /run/health/healthy 2>/dev/null || echo 0) ))" -lt {{ $stale }}
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          # Checks the loop only, not pass success.
          # A restart would kill the supplicants this pod started.
          # The timeout is raised because probes share the CPU quota.
          livenessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - test "$(( $(date +%s) - $(cat /run/health/alive 2>/dev/null || echo 0) ))" -lt {{ $stale }}
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
            - name: run
              mountPath: /run/health
          resources:
            {{- toYaml .Values.supplicantRunner.image.resources | nindent 12 }}
{{- end }}
