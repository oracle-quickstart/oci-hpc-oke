{{- if .Values.supplicantRunner.enabled }}
{{- $runner := .Files.Get "files/supplicant-runner/runner.sh" }}
{{- $reconcile := .Files.Get "files/supplicant-runner/supplicant-runner.sh" }}
{{- if or (empty $runner) (empty $reconcile) }}
{{- fail "supplicantRunner: files/supplicant-runner/{runner,supplicant-runner}.sh are missing or empty; the DaemonSet would run an empty script" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "oci-hpc-oke-utils.supplicantRunnerScriptName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "oci-hpc-oke-utils.labels" . | nindent 4 }}
    app.kubernetes.io/component: supplicant-runner
  annotations:
    # The name is content-addressed, so an upgrade creates a new ConfigMap.
    # Helm would prune this one while older pods still mount it.
    # Keeping it costs a little litter. Prune after a rollout with
    #   kubectl delete cm -l app.kubernetes.io/component=supplicant-runner
    "helm.sh/resource-policy": keep
# Immutable, so nobody can edit what a privileged DaemonSet executes.
# Changing a script changes the name above and rolls the DaemonSet.
# The hash covers the scripts only.
# Editing this template alone keeps the name, so the update is rejected.
immutable: true
data:
  runner.sh: |
{{ $runner | indent 4 }}
  supplicant-runner.sh: |
{{ $reconcile | indent 4 }}
{{- end }}
