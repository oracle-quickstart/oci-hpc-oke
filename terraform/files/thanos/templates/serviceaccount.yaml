apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "thanos.labels" . | nindent 4 }}
automountServiceAccountToken: true
---
# OKE workload identity: provider, bucket and region only, no credentials.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.objstore.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "thanos.labels" . | nindent 4 }}
type: Opaque
stringData:
  objstore.yml: |
    type: OCI
    config:
      provider: oke-workload-identity
      bucket: {{ required "objstore.bucket is required" .Values.objstore.bucket | quote }}
      region: {{ required "objstore.region is required" .Values.objstore.region | quote }}
      part_size: {{ .Values.objstore.partSize | int64 }}
