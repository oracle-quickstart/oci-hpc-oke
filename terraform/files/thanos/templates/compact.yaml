# Compactor: compacts the 2h sidecar blocks (2h -> 8h -> 2d -> 14d), downsamples
# to 5m and 1h, and applies the bucket retention. Exactly one per bucket.
apiVersion: v1
kind: Service
metadata:
  name: thanos-compact
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: thanos-compact
    {{- include "thanos.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: thanos-compact
  ports:
    - name: http
      port: 10902
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: thanos-compact
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: thanos-compact
    {{- include "thanos.labels" . | nindent 4 }}
spec:
  replicas: 1
  serviceName: thanos-compact
  selector:
    matchLabels:
      app.kubernetes.io/name: thanos-compact
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Delete
  template:
    metadata:
      labels:
        app.kubernetes.io/name: thanos-compact
        {{- include "thanos.labels" . | nindent 8 }}
      annotations:
        checksum/objstore: {{ include (print $.Template.BasePath "/serviceaccount.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: thanos-compact
          image: {{ include "thanos.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - compact
            - --log.level=info
            - --wait
            - --wait-interval=5m
            - --data-dir=/var/thanos/compact
            - --objstore.config-file=/etc/thanos/objstore.yml
            - --http-address=0.0.0.0:10902
            - --retention.resolution-raw={{ .Values.compact.retention.raw }}
            - --retention.resolution-5m={{ .Values.compact.retention.fiveMinutes }}
            - --retention.resolution-1h={{ .Values.compact.retention.oneHour }}
            - --delete-delay={{ .Values.compact.deleteDelay }}
            - --block-viewer.global.sync-block-interval={{ .Values.compact.blockViewerSyncInterval }}
            - --compact.concurrency=1
            - --downsample.concurrency=1
            - --enable-auto-gomemlimit
            {{- range .Values.compact.extraArgs }}
            - {{ . }}
            {{- end }}
          ports:
            - name: http
              containerPort: 10902
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            periodSeconds: 30
            failureThreshold: 8
          resources:
            {{- toYaml .Values.compact.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/thanos/compact
            - name: objstore
              mountPath: /etc/thanos
              readOnly: true
      volumes:
        - name: objstore
          secret:
            secretName: {{ .Values.objstore.secretName }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        storageClassName: {{ .Values.compact.storage.storageClassName }}
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ .Values.compact.storage.size }}
